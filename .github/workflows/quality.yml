name: Test quality

# Is the test suite any good? Mutation testing and fault seeding, weekly and on demand.
on:
  schedule:
    - cron: "30 3 * * 1"   # Mondays 09:00 IST
  workflow_dispatch:

jobs:
  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python tools/mutation.py
      - name: Gate — mutation score must stay at or above 90 %
        run: |
          python - <<'PY'
          import json, sys
          s = json.load(open("reports/mutation.json"))["summary"]
          print(f"killed {s['killed']} · equivalent {s['equivalent']} · survived {s['survived']} · score {s['mutation_score_pct']} %")
          sys.exit(0 if s["mutation_score_pct"] >= 90 else 1)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mutation-report
          path: reports/mutation.json

  fault-seeding:
    name: Fault seeding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tools/fault_seeding.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fault-seeding-report
          path: reports/fault_seeding.json
