name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check app tests tools
      - name: Bandit (high severity gate)
        run: bandit -r app -lll
      - name: Packaging checks
        run: python tools/check_package.py

  test:
    name: Test suite (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run all 554 test cases with coverage
        run: >-
          pytest -q --cov=app --cov-branch --cov-report=term --cov-report=xml
          --junitxml=reports/junit.xml --html=reports/test_report.html --self-contained-html
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-py${{ matrix.python }}
          path: |
            reports/results.json
            reports/junit.xml
            reports/test_report.html
            coverage.xml
            reports/screenshots/
      - name: Job summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, collections
          r = json.load(open("reports/results.json"))
          c = collections.Counter(x["status"] for x in r)
          print(f"### {len(r)} test cases — {c['PASS']} passed · {c['SKIPPED']} skipped · {c['FAIL']} failed\n")
          print("| Level | Cases | Passed |\n|---|---:|---:|")
          for lv in ["Unit", "Integration", "System", "System (E2E UI)", "Acceptance (UAT)"]:
              rs = [x for x in r if x["level"] == lv]
              print(f"| {lv} | {len(rs)} | {sum(x['status'] == 'PASS' for x in rs)} |")
          PY

  cross-browser:
    name: Cross-browser E2E (Firefox, WebKit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium firefox webkit
      - name: Run E2E in Chromium, Firefox and WebKit
        run: pytest -q --tc -m e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-browser-evidence
          path: |
            reports/results_partial.json
            reports/screenshots/
