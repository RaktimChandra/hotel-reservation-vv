name: Release

# Builds every document from the committed evidence and attaches them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deliverables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - name: System packages (LibreOffice, poppler, ffmpeg, fonts)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer libreoffice-impress \
            poppler-utils ffmpeg fonts-inter fonts-dejavu fontconfig
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: python -m playwright install --with-deps chromium
      - name: Workbook
        run: python tools/make_workbook.py
      - name: Report (two-pass table of contents → DOCX + PDF)
        run: python tools/doc/toc_pass.py tools/doc/report.js deliverables/HRRS_VV_Test_Report_Raktim.docx
      - name: Companion documents and slide deck
        run: |
          node tools/doc/companions.js
          node tools/deck/deck.js
          cd deliverables
          for f in *_Raktim.docx HRRS_VV_Presentation_Raktim.pptx; do
            [ "$f" = HRRS_VV_Test_Report_Raktim.docx ] && continue
            soffice --headless --convert-to pdf --outdir . "$f"
          done
      - name: Dashboard and one-page summary
        run: |
          python tools/make_dashboard.py
          python tools/make_onepager.py
      - name: Demo video
        continue-on-error: true
        run: |
          python tools/record_demo.py
          python tools/make_video.py
      - uses: actions/upload-artifact@v4
        with:
          name: deliverables
          path: deliverables/
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: HRRS V&V ${{ github.ref_name }}
          body: |
            Documents generated by CI from the evidence committed at this tag.

            | File | Contents |
            |---|---|
            | `HRRS_VV_Test_Report_Raktim.pdf` / `.docx` | Full test report: plan, design, cases, execution, metrics |
            | `HRRS_VV_Presentation_Raktim.pptx` / `.pdf` | Slide deck |
            | `HRRS_Test_Case_Workbook_Raktim.xlsx` | 554 automated + 10 manual cases, RTM, defect log, metrics |
            | `HRRS_Test_Summary_Report_IEEE829_Raktim.*` | IEEE 829 test summary report |
            | `HRRS_Manual_Test_Execution_Kit_Raktim.*` | Manual-case records and kits |
            | `HRRS_Case_Studies_Raktim.*` · `HRRS_CycleTest3_Prep_*` | Case studies · worked problems |
            | `HRRS_Test_Results_Dashboard.html` | Searchable results (open in a browser) |
            | `HRRS_One_Page_Summary_Raktim.pdf` | One-page summary |
            | `HRRS_Demo_Video_Raktim.mp4` | Captioned demo |
          files: deliverables/*
          fail_on_unmatched_files: false
