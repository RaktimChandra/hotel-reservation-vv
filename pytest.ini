[pytest]
testpaths = tests
addopts = -p no:cacheprovider
filterwarnings = ignore::DeprecationWarning
markers =
    tc: test-case metadata
    smoke: smoke suite
    regression: regression suite
    security: security suite
    performance: performance suite
    e2e: end-to-end UI suite
    recovery: recovery / fault-injection suite
    concurrency: concurrency suite
    a11y: accessibility suite
    UAT-01: acceptance scenario tag
    UAT-02: acceptance scenario tag
    UAT-03: acceptance scenario tag
    UAT-04: acceptance scenario tag
